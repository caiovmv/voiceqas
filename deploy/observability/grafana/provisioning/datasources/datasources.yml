apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
      lokiSearch:
        datasourceUid: loki

  - name: VoiceQAS API
    uid: voiceqas-api
    type: marcusolsson-json-datasource
    access: proxy
    url: http://voiceqas:8080
    jsonData:
      httpHeaderName1: X-Ops-Token
    secureJsonData:
      httpHeaderValue1: dev-read

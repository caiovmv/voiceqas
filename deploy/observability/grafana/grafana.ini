# Dev stack — anonymous Viewer + login admin; evita spam de session token nos logs.

[server]
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
hide_version = true

[users]
allow_sign_up = false
default_theme = dark

[log]
# "user token not found" é warn inofensivo quando anonymous está ativo (cookie de sessão ausente/expirado).
filters = authn.service:error
